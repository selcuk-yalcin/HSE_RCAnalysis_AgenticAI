# Railway config-as-code (backup for railway.json — forces Dockerfile, not Railpack).
# API: default CMD from Dockerfile (uvicorn).
# Worker: override Start Command in Railway UI → sh scripts/railway_celery_worker.sh
# NOTE: Do not add healthcheckPath here — this repo is shared by API and Worker services.
# Set healthcheck on the API service via the Railway dashboard instead.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
