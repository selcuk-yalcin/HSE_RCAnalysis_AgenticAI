# Railway config-as-code (backup for railway.json — forces Dockerfile, not Railpack).
# API: default CMD from Dockerfile (uvicorn). Set healthcheck in Railway UI only on API:
#   /api/v1/health
# Worker: override Start Command → sh scripts/railway_celery_worker.sh (no HTTP healthcheck)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
